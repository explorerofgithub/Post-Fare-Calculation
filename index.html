<!DOCTYPE html>
<html>
<head>
    <title>Post Fare Calculator</title>
    <!-- 引入 Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 美化滾動條 */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(20, 184, 166, 0.3); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(20, 184, 166, 0.6); }

        /* 信封飛出動畫 */
        @keyframes flyOut {
            0% {
                transform: translate(-50%, 50%) scale(1) rotate(0deg);
                opacity: 1;
            }
            20% {
                transform: translate(-50%, -100%) scale(1.1) rotate(10deg);
                opacity: 1;
            }
            100% {
                transform: translate(150%, -200%) scale(0.5) rotate(90deg);
                opacity: 0;
            }
        }
        .animate-fly-out {
            animation: flyOut 1.5s ease-out forwards;
        }

        /* 信封閃爍光芒效果 */
        #envelopeAnimation::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 120px;
            height: 120px;
            background-image: radial-gradient(circle, rgba(255, 255, 200, 0.7) 0%, rgba(255, 255, 200, 0) 70%);
            border-radius: 50%;
            opacity: 0;
            transform: translate(-50%, -50%) scale(0.5);
        }
        @keyframes sparkle-effect {
            0%, 100% { opacity: 0; transform: translate(-50%, -50%) scale(0.5); }
            50% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
        }
        .animate-fly-out::after {
            animation: sparkle-effect 0.75s ease-in-out 2;
        }

        /* 收據撕邊效果 */
        .receipt {
            /* 修正後的收據撕邊效果：
               這個遮罩會產生一個在底部有透明圓孔的圖樣，並水平重複，
               同時確保遮罩的其餘部分是實心不透明的，讓收據內容可以正常顯示。*/
            -webkit-mask-image: radial-gradient(circle at 50% 100%, transparent 4px, black 5px);
            mask-image: radial-gradient(circle at 50% 100%, transparent 4px, black 5px);
            -webkit-mask-size: 16px 100%;
            mask-size: 16px 100%;
            -webkit-mask-repeat: repeat-x;
            mask-repeat: repeat-x;
        }

        /* 收據滑入動畫 */
        @keyframes slideInDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .animate-slide-in {
            animation: slideInDown 0.4s ease-out forwards;
        }
    </style>
</head>
<body class="text-slate-800 flex items-center justify-center min-h-screen antialiased font-sans p-4 relative overflow-hidden" 
      style="background-image: url('https://images.unsplash.com/photo-1512314889357-e157c22f938d?q=80&w=2048&auto=format&fit=crop'); background-size: cover; background-position: center;">

<!-- 現代風格的亮色半透明遮罩 -->
<div class="absolute inset-0 bg-slate-200/60 backdrop-blur-sm"></div>

<div class="z-10 relative flex flex-col md:flex-row gap-8 w-full max-w-4xl justify-center items-stretch">
    <!-- 左側卡片：運費計算器 -->
    <div class="bg-white/90 backdrop-blur-md p-8 rounded-3xl shadow-[0_20px_50px_-15px_rgba(0,0,0,0.15)] w-full max-w-sm border border-white flex flex-col relative overflow-hidden">
        <!-- 裝飾用郵局紅藍邊條 -->
        <div class="absolute top-0 left-0 w-full h-2 bg-gradient-to-r from-red-500 via-white to-blue-500"></div>
        <h2 class="text-3xl font-bold mb-6 mt-2 text-center text-teal-700 drop-shadow-sm">📮 現代郵務所</h2>

        <div class="mb-4 flex gap-3">
            <div class="flex-1">
                <label for="originCountry" class="block text-sm font-bold text-slate-600 mb-2 tracking-wider">寄件地:</label>
                <select id="originCountry" class="w-full px-3 py-3 bg-white border-slate-200 border-2 rounded-xl focus:outline-none focus:ring-0 focus:border-teal-500 text-slate-800 transition-colors shadow-inner">
                    <option value="TW">台灣</option>
                    <option value="US">美國</option>
                    <option value="JP">日本</option>
                    <option value="KR">韓國</option>
                </select>
            </div>
            <div class="flex-1">
                <label for="destCountry" class="block text-sm font-bold text-slate-600 mb-2 tracking-wider">收件地:</label>
                <select id="destCountry" class="w-full px-3 py-3 bg-white border-slate-200 border-2 rounded-xl focus:outline-none focus:ring-0 focus:border-teal-500 text-slate-800 transition-colors shadow-inner">
                    <option value="TW">台灣</option>
                    <option value="US">美國</option>
                    <option value="JP">日本</option>
                    <option value="KR">韓國</option>
                </select>
            </div>
        </div>

        <div class="mb-4">
            <label for="quantity" class="block text-sm font-bold text-slate-600 mb-2 tracking-wider">明信片數量:</label>
            <input type="number" id="quantity" placeholder="請輸入數量" value="1" min="1" class="w-full px-4 py-3 bg-white border-slate-200 border-2 rounded-xl focus:outline-none focus:ring-0 focus:border-teal-500 transition-colors shadow-inner text-slate-800 placeholder-slate-400">
        </div>

        <!-- 3D 按壓效果按鈕 -->
        <button id="calcBtn" onclick="calculateFare()" class="w-full bg-teal-600 hover:bg-teal-500 text-white font-bold py-3 px-4 rounded-xl shadow-[0_5px_0_rgb(17,94,89)] active:shadow-[0_0px_0_rgb(17,94,89)] active:translate-y-[5px] transition-all mt-auto">計算郵資</button>

        <p id="fareResult" class="mt-6 text-center text-lg font-bold text-teal-700 min-h-[1.75rem]"></p>

        <!-- 信封動畫元素 -->
        <div id="envelopeAnimation" class="absolute bottom-1/2 left-1/2 -translate-x-1/2 translate-y-1/2 opacity-0 pointer-events-none z-20">
            <svg width="80" height="60" viewBox="0 0 80 60" fill="none" xmlns="http://www.w3.org/2000/svg">
                <!-- 信封主體 -->
                <rect x="0" y="10" width="80" height="50" fill="#F3F4F6"/>
                <!-- 上蓋 (閉合狀態) -->
                <path d="M0 10L40 40L80 10L0 10Z" fill="#E5E7EB"/>
                <!-- 左側蓋 -->
                <path d="M0 10L0 60L40 40L0 10Z" fill="#D1D5DB"/>
                <!-- 右側蓋 -->
                <path d="M80 10L80 60L40 40L80 10Z" fill="#D1D5DB"/>
            </svg>
        </div>
    </div>

    <!-- 右側卡片：歷史紀錄 -->
    <div class="bg-white/90 backdrop-blur-md p-8 rounded-3xl shadow-[0_20px_50px_-15px_rgba(0,0,0,0.15)] w-full max-w-sm border border-white flex flex-col">
        <h2 class="text-2xl font-bold mb-6 text-center text-blue-700 drop-shadow-sm">🗂️ 郵資查詢紀錄</h2>
        <ul id="historyList" class="flex-1 overflow-y-auto space-y-3 max-h-[250px] md:max-h-[300px] pr-2">
            <li id="emptyMsg" class="text-slate-400 text-center italic mt-4">尚無查詢紀錄</li>
        </ul>
        
        <!-- 清空紀錄按鈕 -->
        <button onclick="clearHistory()" class="mt-6 w-full bg-white border-2 border-rose-200 text-rose-500 hover:bg-rose-50 font-medium py-2 px-4 rounded-xl shadow-[0_4px_0_rgb(254,205,211)] active:shadow-[0_0px_0_rgb(254,205,211)] active:translate-y-[4px] transition-all">
            🗑️ 清除紀錄
        </button>
    </div>
</div>

<!-- 引入外部 JavaScript -->
<script src="./static/fare_calculators.js"></script>
</body>
</html>
